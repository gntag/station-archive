name: tests

# The suite touches no network and runs in a few seconds, so there is no reason
# for it not to gate every change. It is also the only executable statement of
# what this archive's rules are, which makes a red build a scientific signal
# rather than a housekeeping one.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
        # Both platforms matter here: the archive root default resolves
        # differently on POSIX and Windows, and a drive-letter path that is
        # absolute on one is relative on the other.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run the suite
        # No network access is expected. A test that needs one is a bug in the
        # test, not a reason to relax this.
        run: python -m pytest tests/ -q

      - name: Run the demo end to end
        # The demo exercises the real adapters, crosswalk, consolidator and
        # breakpoint diagnosis on synthetic provider-format files. If it stops
        # working, the pipeline a reader meets first is broken.
        run: python -m station_archive.cli demo --stations 6 --years 6

      - name: Check the package builds and imports from an install
        run: |
          python -m pip install --upgrade build
          python -m build --wheel --outdir dist
          python -c "import station_archive; print(station_archive.__version__)"
          station-archive --help
